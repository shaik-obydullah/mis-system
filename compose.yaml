services:
  php:
    build:
      context: ./docker/php
    container_name: mis-php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/mis.ini
    environment:
      - PHP_IDE_CONFIG=serverName=mis
    depends_on:
      db:
        condition: service_healthy
    restart: no

  nginx:
    image: nginx:alpine
    container_name: mis-nginx
    ports:
      - "8034:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: no

  db:
    image: mysql:8.0
    container_name: mis-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mis_system
      MYSQL_USER: mis
      MYSQL_PASSWORD: REMOVED
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: no

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mis-phpmyadmin
    ports:
      - "8035:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    restart: no

  mailer:
    image: axllent/mailpit
    container_name: mis-mailer
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: no

volumes:
  db_data:
