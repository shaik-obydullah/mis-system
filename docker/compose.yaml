services:
  php:
    build:
      context: ./php
    container_name: mis-php
    working_dir: /var/www/html
    volumes:
      - ../.:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/mis.ini
    environment:
      - PHP_IDE_CONFIG=serverName=mis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mis-nginx
    ports:
      - "8034:80"
    volumes:
      - ../.:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: mis-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mis_system
      MYSQL_USER: mis
      MYSQL_PASSWORD: REMOVED
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mis-phpmyadmin
    ports:
      - "8035:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
